<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 512" preserveAspectRatio="xMidYMid meet" class="restock-flow" role="img" aria-labelledby="rf-title rf-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="rf-title">How Restock works</title>
  <desc id="rf-desc">Albert Heijn discounts, the Crisp catalogue, photos of my cabinets and my own rules flow into Restock, which produces a shopping list and a weekly menu, leading to less food waste and a smaller grocery bill.</desc>
  <defs>
    <clipPath id="rf-clip-ah"><rect x="30" y="44" width="48" height="48" rx="12"/></clipPath>
    <clipPath id="rf-clip-crisp"><rect x="30" y="152" width="48" height="48" rx="12"/></clipPath>
    <clipPath id="rf-clip-photos"><rect x="30" y="260" width="48" height="48" rx="12"/></clipPath>
    <clipPath id="rf-clip-rules"><rect x="30" y="368" width="48" height="48" rx="12"/></clipPath>
    <clipPath id="rf-clip-shop"><rect x="300" y="180" width="100" height="100" rx="16"/></clipPath>
    <clipPath id="rf-fill">
      <rect x="474" y="376" width="0" height="72" rx="24">
        <animate attributeName="width" dur="7s" repeatCount="indefinite" values="0;0;210;210;0;0" keyTimes="0;0.62;0.7;0.93;0.97;1"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .restock-flow .title { font-family: 'Sofia Sans Condensed', sans-serif; font-weight: 500; font-size: 20px; fill: #333; transform-box: fill-box; }
    .restock-flow .caption { font-family: Inter, sans-serif; font-weight: 300; font-size: 12px; fill: #555; }
    .restock-flow .res-text { font-family: 'Sofia Sans Condensed', sans-serif; font-weight: 500; font-size: 20px; text-anchor: middle; }
    .restock-flow .line { fill: none; stroke: #0016F2; stroke-opacity: .22; stroke-width: 1.5; }
    .restock-flow .dot { fill: #0016F2; }
    .restock-flow .icon { fill: none; stroke: #0016F2; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .restock-flow .pulse { fill: none; stroke: #0016F2; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: rf-pulse 7s infinite; }
    .restock-flow .hit { fill: none; stroke: #0016F2; stroke-width: 1.5; opacity: 0; animation: rf-hit 7s infinite; }
    .restock-flow .hit-2 { animation-delay: .2s; }
    .restock-flow .ghost { animation: none; }
    .restock-flow .result { transform-box: fill-box; transform-origin: center; animation: rf-settle 7s infinite; }
    .restock-flow .static-result { display: none; }
    @keyframes rf-pulse { 0%, 22% { opacity: 0; transform: scale(1); } 27% { opacity: .5; } 40%, 100% { opacity: 0; transform: scale(1.18); } }
    @keyframes rf-hit { 0%, 50% { opacity: 0; } 54% { opacity: 1; } 68%, 100% { opacity: 0; } }
    @keyframes rf-breathe { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @keyframes rf-settle { 0%, 69% { transform: scale(1); } 72% { transform: scale(1.04); } 76%, 100% { transform: scale(1); } }
    @container (max-width: 480px) {
      .restock-flow .caption { display: none; }
      .restock-flow .title { font-size: 28px; transform: translateY(13px); }
      .restock-flow .res-text { font-size: 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .restock-flow .dot, .restock-flow .anim-result { display: none; }
      .restock-flow .static-result { display: inline; }
      .restock-flow .pulse, .restock-flow .hit, .restock-flow .ghost { animation: none; opacity: 0; }
    }
  </style>

  <rect class="stage-bg" width="704" height="512" fill="#EBF0F3"/>

  <g transform="translate(2 17)">
    <path id="rf-in1" class="line" d="M226 68 C 268 68, 262 230, 300 230"/>
    <path id="rf-in2" class="line" d="M226 176 C 266 176, 264 230, 300 230"/>
    <path id="rf-in3" class="line" d="M226 284 C 266 284, 264 230, 300 230"/>
    <path id="rf-in4" class="line" d="M226 392 C 268 392, 262 230, 300 230"/>
    <path id="rf-out1" class="line" d="M400 230 C 442 230, 440 168, 474 168"/>
    <path id="rf-out2" class="line" d="M400 230 C 442 230, 440 288, 474 288"/>
    <path id="rf-res" class="line" stroke-dasharray="3 5" d="M579 326 L 579 376"/>

    <g>
      <rect x="16" y="30" width="210" height="76" rx="20" fill="#fff"/>
      <rect x="30" y="44" width="48" height="48" rx="12" fill="#FDE4DF"/>
      <image href="assets/images/albert.png" x="30" y="44" width="48" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#rf-clip-ah)"/>
      <text class="title" x="90" y="64">Albert Heijn</text>
      <text class="caption" x="90" y="84">this week's discounts</text>
    </g>
    <g>
      <rect x="16" y="138" width="210" height="76" rx="20" fill="#fff"/>
      <rect x="30" y="152" width="48" height="48" rx="12" fill="#FDE4DF"/>
      <image href="assets/images/crisp.png" x="30" y="152" width="48" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#rf-clip-crisp)"/>
      <text class="title" x="90" y="172">Crisp</text>
      <text class="caption" x="90" y="192">the full catalogue</text>
    </g>
    <g>
      <rect x="16" y="246" width="210" height="76" rx="20" fill="#fff"/>
      <image href="assets/images/photo-app.webp" x="30" y="260" width="48" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#rf-clip-photos)"/>
      <text class="title" x="90" y="280">Photos</text>
      <text class="caption" x="90" y="300">what's in my cabinets</text>
    </g>
    <g>
      <rect x="16" y="354" width="210" height="76" rx="20" fill="#fff"/>
      <rect x="30" y="368" width="48" height="48" rx="12" fill="#FDE4DF"/>
      <image href="assets/images/claude-app.png" x="30" y="368" width="48" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#rf-clip-rules)"/>
      <text class="title" x="90" y="388">My rules</text>
      <text class="caption" x="90" y="408">budget, taste, time</text>
    </g>

    <rect class="pulse" x="300" y="180" width="100" height="100" rx="16"/>
    <g clip-path="url(#rf-clip-shop)">
      <image href="assets/images/app-shop.png" x="300" y="180" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <g>
      <rect x="474" y="130" width="210" height="76" rx="20" fill="#fff"/>
      <rect class="hit" x="474" y="130" width="210" height="76" rx="20"/>
      <circle cx="512" cy="168" r="24" fill="#FFF2D7"/>
      <path class="icon" d="M503 160 l2 2 4-4 M513 160 H522 M503 168 l2 2 4-4 M513 168 H522 M503 176 l2 2 4-4 M513 176 H522"/>
      <text class="title" x="548" y="164">Shopping list</text>
      <text class="caption" x="548" y="184">only what's missing</text>
    </g>
    <g>
      <rect x="474" y="250" width="210" height="76" rx="20" fill="#fff"/>
      <rect class="hit hit-2" x="474" y="250" width="210" height="76" rx="20"/>
      <circle cx="512" cy="288" r="24" fill="#FFF2D7"/>
      <rect class="icon" x="500" y="278" width="24" height="22" rx="4"/>
      <path class="icon" d="M500 285 H524 M506 274 V281 M518 274 V281"/>
      <text class="title" x="548" y="284">Weekly menu</text>
      <text class="caption" x="548" y="304">built around the deals</text>
    </g>

    <g class="result anim-result">
      <g class="ghost" opacity="0.1">
        <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.1;0.1;0;0;0.1;0.1" keyTimes="0;0.69;0.7;0.96;0.97;1"/>
        <rect x="474" y="376" width="210" height="72" rx="24" fill="none" stroke="#0016F2" stroke-width="1.5" stroke-dasharray="4 5"/>
        <text class="res-text" x="579" y="407" fill="#0016F2">Less food waste</text>
        <text class="res-text" x="579" y="431" fill="#0016F2">Smaller grocery bill</text>
      </g>
      <g clip-path="url(#rf-fill)">
        <rect x="474" y="376" width="210" height="72" rx="24" fill="#0016F2"/>
        <text class="res-text" x="579" y="407" fill="#fff">Less food waste</text>
        <text class="res-text" x="579" y="431" fill="#fff">Smaller grocery bill</text>
      </g>
    </g>
    <g class="static-result">
      <rect x="474" y="376" width="210" height="72" rx="24" fill="#0016F2"/>
      <text class="res-text" x="579" y="407" fill="#fff">Less food waste</text>
      <text class="res-text" x="579" y="431" fill="#fff">Smaller grocery bill</text>
    </g>

    <circle class="dot" r="4" opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.2;1"><mpath href="#rf-in1"/></animateMotion>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.19;0.2;1"/>
    </circle>
    <circle class="dot" r="4" opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.035;0.235;1"><mpath href="#rf-in2"/></animateMotion>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.035;0.045;0.225;0.235;1"/>
    </circle>
    <circle class="dot" r="4" opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.07;0.27;1"><mpath href="#rf-in3"/></animateMotion>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.07;0.08;0.26;0.27;1"/>
    </circle>
    <circle class="dot" r="4" opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.105;0.305;1"><mpath href="#rf-in4"/></animateMotion>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.105;0.115;0.295;0.305;1"/>
    </circle>
    <circle class="dot" r="4" opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.34;0.51;1"><mpath href="#rf-out1"/></animateMotion>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.34;0.35;0.5;0.51;1"/>
    </circle>
    <circle class="dot" r="4" opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.37;0.54;1"><mpath href="#rf-out2"/></animateMotion>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.37;0.38;0.53;0.54;1"/>
    </circle>
    <circle class="dot" r="4" opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.56;0.62;1"><mpath href="#rf-res"/></animateMotion>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.56;0.57;0.61;0.62;1"/>
    </circle>
  </g>
</svg>
