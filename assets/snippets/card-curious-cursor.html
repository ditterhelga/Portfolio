<!--
  Archived: "Click if you're curious" follower cursor for work-card images.
  Replaces the plain VIEW cursor on #work .card-image-frame hover.

  To restore in index.html:
  1. Paste the CSS block into the page <style> (replacing .card-view-cursor rules).
  2. Paste the HTML where the current <div class="card-view-cursor">VIEW</div> is.
  3. Paste the JS in place of the work-card VIEW cursor script.
  Requires: existing @keyframes rotate, --color-primary-light, GSAP, html.is-safari if used.
-->

<!-- ========== CSS ========== -->
<style>
        .card-view-cursor {
            display: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .card-view-cursor {
                position: fixed;
                width: 112px;
                height: 112px;
                background: transparent;
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                top: 0;
                left: 0;
                transform: translateZ(0);
                -webkit-backface-visibility: hidden;
                backface-visibility: hidden;
                will-change: transform, opacity;
                overflow: hidden;
                font-family: 'Sofia Sans Condensed', sans-serif;
            }

            .card-view-cursor__svg {
                width: 100%;
                height: 100%;
                display: block;
            }

            .card-view-cursor__svg text {
                fill: white;
                font-family: 'Sofia Sans Condensed', sans-serif;
                font-size: 64px;
                font-weight: 600;
                text-transform: uppercase;
                animation: rotate 25s linear infinite;
                transform-origin: center;
            }

            .card-view-cursor__svg .card-view-cursor__text {
                transform-origin: center;
            }

            .card-view-cursor__svg .card-view-cursor__text-safari {
                display: none;
            }

            .card-view-cursor__svg .card-view-cursor__ring {
                fill: var(--color-primary-light);
            }

            .card-view-cursor__arrow {
                position: absolute;
                width: 22px;
                height: 22px;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                overflow: visible;
            }

            .card-view-cursor__arrow path {
                fill: none;
                stroke: #FFFFFF;
                stroke-width: 2.5;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .card-view-cursor__soon {
                display: none;
                font-weight: 600;
                font-size: 18px;
                letter-spacing: 0.03em;
                color: white;
                text-transform: uppercase;
            }

            .card-view-cursor.is-soon {
                background: var(--color-primary-light);
            }

            .card-view-cursor.is-soon .card-view-cursor__svg,
            .card-view-cursor.is-soon .card-view-cursor__arrow {
                display: none;
            }

            .card-view-cursor.is-soon .card-view-cursor__soon {
                display: block;
            }

            html.is-safari .card-view-cursor__svg .card-view-cursor__text {
                display: none;
            }

            html.is-safari .card-view-cursor__svg .card-view-cursor__text-safari {
                display: block;
            }

            html.is-safari .card-view-cursor__svg .card-view-cursor__text-safari text {
                animation: none;
            }
        }
</style>

<!-- ========== HTML ========== -->
<div class="card-view-cursor" hidden aria-hidden="true">
    <svg class="card-view-cursor__svg" xmlns="http://www.w3.org/2000/svg" xml:lang="en" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" aria-hidden="true">
        <defs>
            <path id="card-cursor-text-circle"
                  d="M250,420
                     a170,170 0 0,1 0,-340
                     a170,170 0 0,1 0,340"
                  transform="rotate(12,250,250)" />
            <mask id="card-cursor-ring-mask">
                <rect width="500" height="500" fill="white"/>
                <circle cx="250" cy="250" r="140" fill="black"/>
            </mask>
        </defs>
        <path id="card-cursor-text-circle-safari"
              d="M250,420
                 a170,170 0 0,1 0,-340
                 a170,170 0 0,1 0,340"
              transform="rotate(12,250,250)"
              fill="none"
              stroke="none"/>
        <circle class="card-view-cursor__ring" cx="250" cy="250" r="250" mask="url(#card-cursor-ring-mask)"/>
        <g class="card-view-cursor__text">
            <text textLength="1000">
                <textPath xlink:href="#card-cursor-text-circle">Click if you're curious</textPath>
            </text>
        </g>
        <g class="card-view-cursor__text-safari">
            <text>
                <textPath xlink:href="#card-cursor-text-circle-safari" textLength="1000" lengthAdjust="spacing">Click if you're curious</textPath>
            </text>
        </g>
    </svg>
    <svg class="card-view-cursor__arrow" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 17L17 7M17 7H9M17 7V15"/>
    </svg>
    <span class="card-view-cursor__soon">Soon</span>
</div>

<!-- ========== JS (inside DOMContentLoaded / after GSAP) ========== -->
<script>
        // Work card image — circular "Click if you're curious" / "Soon" cursor follower
        const cardViewCursor = document.querySelector(".card-view-cursor");
        const cardFrames = document.querySelectorAll("#work .card-image-frame");

        if (cardViewCursor && cardFrames.length && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
            cardViewCursor.hidden = false;
            gsap.set(cardViewCursor, { opacity: 0, scale: 0 });
            cardViewCursor.classList.add("is-ready");

            let isOverCard = false;

            cardFrames.forEach(frame => {
                const isComingSoon = Boolean(frame.closest(".work-case-card--coming-soon"));

                frame.addEventListener("mouseenter", () => {
                    isOverCard = true;
                    frame.style.cursor = "none";
                    cardViewCursor.classList.toggle("is-soon", isComingSoon);
                    gsap.to(cardViewCursor, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" });
                });
                frame.addEventListener("mouseleave", () => {
                    isOverCard = false;
                    frame.style.cursor = "";
                    cardViewCursor.classList.remove("is-soon");
                    gsap.killTweensOf(cardViewCursor);
                    gsap.set(cardViewCursor, { opacity: 0, scale: 0 });
                });
            });

            document.addEventListener("mousemove", e => {
                if (!isOverCard) {
                    const overAnyFrame = Array.from(cardFrames).some(frame => {
                        const r = frame.getBoundingClientRect();
                        return e.clientX >= r.left && e.clientX <= r.right &&
                               e.clientY >= r.top  && e.clientY <= r.bottom;
                    });
                    if (!overAnyFrame) {
                        gsap.killTweensOf(cardViewCursor);
                        gsap.set(cardViewCursor, { opacity: 0, scale: 0 });
                        return;
                    }
                    isOverCard = true;
                }

                gsap.set(cardViewCursor, {
                    x: Math.round(e.clientX),
                    y: Math.round(e.clientY),
                    xPercent: -50,
                    yPercent: -50
                });
            });
        }
</script>
